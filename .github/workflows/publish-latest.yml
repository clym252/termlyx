name: publish latest image
# Moves ghcr.io/clym252/termlyx-server:latest to a release's image only once the
# owner publishes that release. Same digest, so the cosign signature and
# attestations made by release.yml still apply. Publishing a draft that
# release.yml created with GITHUB_TOKEN may not fire `published`; then run it by
# hand: gh workflow run publish-latest.yml -f tag=vX.Y.Z
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
env:
  OWNER: clym252 # GitHub owner; keep in step with release.yml
jobs:
  latest:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the release image
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a vX.Y.Z release tag: $TAG" >&2; exit 1; }
          img="ghcr.io/${OWNER}/termlyx-server"
          docker buildx imagetools create -t "$img:latest" "$img:$TAG"
          want="$(docker buildx imagetools inspect "$img:$TAG" --format '{{json .Manifest.Digest}}')"
          got="$(docker buildx imagetools inspect "$img:latest" --format '{{json .Manifest.Digest}}')"
          echo "latest -> $got"
          [ "$want" = "$got" ] || { echo "latest digest $got differs from $TAG digest $want" >&2; exit 1; }
