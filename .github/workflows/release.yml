name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  OWNER: clym252 # GitHub owner; keep in step with deploy/compose.yml and the install scripts
  NODE_VERSION: "22"
# Release builds use no caches, so a poisoned cache from a PR run cannot reach
# a signed artifact. Signing secrets live only in the `release` environment
# (owner approval per run, v* tags only).
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The tag goes through the environment, never into the script text.
      - name: Tag matches every version
        run: node scripts/release/version.mjs check "$GITHUB_REF_NAME"
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/tauri/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm -C apps/tauri install --frozen-lockfile
      - name: Install cargo-about (pinned)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - name: Third-party notices are up to date
        run: scripts/notices.sh && git diff --exit-code apps/tauri/src/about/

  mac:
    needs: check
    runs-on: macos-15
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain (both Mac targets)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/tauri/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm -C apps/tauri install --frozen-lockfile
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # Tauri imports the Developer ID p12 into a temporary keychain, signs with
      # the hardened runtime, notarizes with the API key and staples.
      - name: Build, sign and notarize (universal)
        working-directory: apps/tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json -- --locked
      # Tauri notarizes the .app only; the DMG users download is the outer
      # container Gatekeeper checks first, so it is notarized and stapled too.
      - name: Notarize and staple the DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -- target/universal-apple-darwin/release/bundle/dmg/*.dmg
          [ $# -eq 1 ] || { echo "expected one DMG, found $#" >&2; exit 1; }
          xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$1"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Notarization ticket and Gatekeeper
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Termlyx.app
          xcrun stapler validate "$app"
          spctl -a -vv "$app"
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
      - name: Stage files
        run: |
          b=target/universal-apple-darwin/release/bundle
          mkdir out
          cp "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz "$b"/macos/*.app.tar.gz.sig out/
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-mac
          path: out/*
          if-no-files-found: error

  # Not code-signed for the beta; the environment is for the updater key only.
  windows:
    needs: check
    runs-on: windows-2022
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/tauri/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm -C apps/tauri install --frozen-lockfile
      - name: Build NSIS installer
        working-directory: apps/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json -- --locked
      - name: Stage files
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig out/
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  # The server jobs publish and sign too, so they wait for the owner's approval
  # like mac and windows (one review covers all pending jobs of the run).
  image:
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          # Only the version tag here: `latest` moves when the owner publishes the
          # release (publish-latest.yml), so dry runs never reach users.
          tags: ghcr.io/${{ env.OWNER }}/termlyx-server:${{ github.ref_name }}
        env:
          # No build-record artifact: it would otherwise be published with the release.
          DOCKER_BUILD_RECORD_UPLOAD: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER}/termlyx-server@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER }}/termlyx-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the exact toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Exact versions and hashes (scripts/release/zig-requirements.txt).
      - name: Install zig tools (pinned, hashed)
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/release/zig-requirements.txt
      - run: cargo zigbuild --release --locked -p tether-server --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/termlyx-server termlyx-server-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bin-${{ matrix.target }}
          path: termlyx-server-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [mac, windows, image, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          mkdir dist
      # Scans the source tree (lockfiles) before any build output lands in dist/.
      - name: Source SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/termlyx-${{ steps.v.outputs.version }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Server deploy files
        run: cp deploy/compose.yml deploy/install.sh deploy/install.ps1 deploy/termlyx-server.service dist/
      # Fails unless Mac and Windows each have one bundle and a signature, so a
      # partial manifest is never published.
      - name: Updater manifest (latest.json)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          printf 'Termlyx %s (beta). Release notes: https://github.com/%s/termlyx/releases/tag/%s\n' \
            "$VERSION" "$OWNER" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.txt"
          node scripts/release/latest-json.mjs --version "$VERSION" --notes "$RUNNER_TEMP/notes.txt" \
            --dir dist --base-url "https://github.com/${OWNER}/termlyx/releases/download/${GITHUB_REF_NAME}" \
            > "$RUNNER_TEMP/latest.json"
          mv "$RUNNER_TEMP/latest.json" dist/latest.json
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The owner reviews the draft and publishes it. Not a pre-release:
      # releases/latest (updater, install scripts) skips pre-releases.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          body_path: .github/release-notes-header.md
          files: dist/*
          fail_on_unmatched_files: true
