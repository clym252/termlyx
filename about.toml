# cargo-about policy for scripts/notices.sh. Keep `accepted` identical to
# [licenses] allow in deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]
