[package]
name = "core-ssh"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Exposes AcceptAll and fake-handle constructors for other crates' tests.
test-util = []

[dependencies]
tokio = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
data-encoding = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }

# SO_EXCLUSIVEADDRUSE for local forward listeners (forward.rs); same version
# as socket2/tokio already pull in. socket2 0.6 has no wrapper for it.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
core-ssh = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
sha2 = { workspace = true }
serde_json = { workspace = true }
