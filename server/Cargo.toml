[package]
name = "tether-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hosted Tether sync server: ciphertext storage, accounts, devices."

[lib]
name = "tether_server"
path = "src/lib.rs"

[[bin]]
name = "termlyx-server"
path = "src/main.rs"

[features]
# Helpers for tests of this crate and of its clients (`core-sync`,
# `tether-app`): `tether_server::testing`. Never enabled in a normal build.
test-util = [
    "dep:tempfile",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
]

[dependencies]
core-proto = { path = "../crates/core-proto" }
anyhow = "1"
argon2 = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "matched-path", "original-uri"] }
# `no-provider`: the crypto provider is chosen below (ring), so aws-lc-rs
# (a C/CMake build) is never pulled into the server.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
data-encoding = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "0.9"
uuid = { workspace = true }
x509-parser = { version = "0.18", default-features = false }
tower-http = { version = "0.6", features = ["trace", "limit"] }
time = "0.3"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Only behind `test-util`.
tempfile = { workspace = true, optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Integration tests use the helpers; enabling the feature through a self
# dev-dependency keeps plain `cargo test -p tether-server` working.
tether-server = { path = ".", features = ["test-util"] }
# WebSocket client for the events tests, and real envelopes for the
# "no plaintext on the server" test. Dev-only: neither is in the server's
# normal dependency graph.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
core-crypto = { path = "../crates/core-crypto" }
