<!doctype html>
<!--
  Sync clip (8 s loop): edit on one device, it shows up on the other.
  1. MacBook, Hosts page (reference/30-33): ✎ on db-01, Edit host, Port 22 -> 2222, Save host.
     The save nudges a push: the sidebar's sync status reads Syncing… (blue), then Synced (green).
  2. The record, sealed, travels to termlyx-server (hex only) and on to the Windows PC.
  3. Windows PC (reference/34-36): Syncing…, the list reads again (vault-changed) and db-01 reads
     admin@192.168.1.20:2222; Synced. Held, then the camera returns to frame 0.
  App screens use the app's own markup and ui.css (shared/app.css). The window chrome, server,
  envelope and the arrival ring are diagrams in site tokens, not app UI.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="shared/app.css" />
    <script src="gsap/gsap.min.js"></script>
    <style>
      /* One world under a camera: the timeline moves #world (translate + scale from its top left). */
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 3800px;
        height: 900px;
        transform-origin: 0 0;
      }
      /* Both app windows at their CSS size; the camera scales them. */
      #world .window {
        zoom: 1;
        border: 1px solid #2c313b;
        border-radius: 10px;
        box-shadow: 0 40px 120px -40px rgb(106 167 255 / 0.25);
      }
      #pc {
        left: 2360px;
      }
      /* Windows-style title bar: the title left, minimise / maximise / close right. */
      .win-titlebar {
        flex: none;
        height: 30px;
        display: flex;
        align-items: center;
        padding-left: 12px;
        background: #2b2c30;
        border-bottom: 1px solid #0b0c0e;
        color: #d6d8dc;
        font-size: 12px;
      }
      .win-controls {
        margin-left: auto;
        display: flex;
        height: 100%;
      }
      .win-controls svg {
        width: 46px;
        height: 30px;
      }
      .focus-ring {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      /* Which device is which: a label under each window. */
      .device-tag {
        position: absolute;
        top: 828px;
        width: 1440px;
        text-align: center;
      }
      .device-tag span {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 999px;
        background: #20242c;
        border: 1px solid #2c313b;
        color: #e3e6eb;
        font-size: 20px;
        font-weight: 600;
      }

      /* Sealed record. */
      .envelope {
        position: absolute;
        left: 0;
        top: 0;
        width: 96px;
        height: 68px;
        margin: -34px 0 0 -48px;
        z-index: 50;
        filter: drop-shadow(0 0 18px rgb(106 167 255 / 0.55));
      }
      .ghost {
        position: absolute;
        z-index: 49;
      }
      /* Where the record lands on the PC: a ring around the card that fades. */
      .arrive {
        position: absolute;
        z-index: 48;
        border: 2px solid #6aa7ff;
        border-radius: 12px;
        box-shadow: 0 0 36px rgb(106 167 255 / 0.5);
        opacity: 0;
      }

      /* termlyx-server: a box of ciphertext (as the walkthrough). */
      .srv {
        position: absolute;
        left: 1640px;
        top: 245px;
        width: 520px;
        height: 320px;
        display: flex;
        flex-direction: column;
        background: #191c22;
        border: 2px solid #2c313b;
        border-radius: 16px;
        overflow: hidden;
        font-family: var(--mono);
      }
      .srv-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 22px;
        border-bottom: 1px solid #2c313b;
        background: #20242c;
        color: #e3e6eb;
        font-size: 22px;
        font-weight: 600;
      }
      .srv-body {
        position: relative;
        flex: 1;
        overflow: hidden;
        padding: 0 22px;
      }
      .srv-hex {
        color: #8a92a0;
        font-size: 19px;
        line-height: 30px;
        white-space: pre;
      }
      .srv-flash {
        position: absolute;
        inset: -2px;
        border: 2px solid #6aa7ff;
        border-radius: 16px;
        box-shadow: 0 0 40px rgb(106 167 255 / 0.45);
        opacity: 0;
      }
    </style>
  </head>

                      <div class="hosts-tools"><input class="hosts-filter" placeholder="Filter…" type="search" value="" /><button type="button">Import SSH config…</button><button type="button">New group</button><button type="button" class="primary hosts-new-host">New host</button></div>
                    </header>
                    <nav class="breadcrumb"><ol><li><button type="button" class="crumb" aria-current="location">All hosts</button></li></ol></nav>
                    <div class="hosts-layout">
                      <div class="host-list-pane">
                        <div class="hosts-section">
                          <h2 class="section-head">Hosts</h2>
                          <ul class="card-grid">
                            <li><div class="host-card"><button type="button" class="host-card-main"><span class="host-badge" style="background: var(--badge-7-bg); color: var(--badge-7-fg)">BB</span><span class="host-card-text"><span class="host-card-label">build-box</span><span class="host-card-sub">deploy@192.168.1.40</span></span></button><span class="host-card-actions"><button type="button" class="host-card-edit">✎</button><button type="button" class="host-card-connect">Connect</button></span></div></li>
                            <li><div class="host-card" id="p-db-card"><button type="button" class="host-card-main"><span class="host-badge" style="background: var(--badge-2-bg); color: var(--badge-2-fg)">D0</span><span class="host-card-text"><span class="host-card-label">db-01</span><span class="host-card-sub" id="p-db-sub">admin@192.168.1.20</span></span></button><span class="host-card-actions"><button type="button" class="host-card-edit">✎</button><button type="button" class="host-card-connect">Connect</button></span></div></li>
                            <li><div class="host-card"><button type="button" class="host-card-main"><span class="host-badge" style="background: var(--badge-8-bg); color: var(--badge-8-fg)">NA</span><span class="host-card-text"><span class="host-card-label">nas</span><span class="host-card-sub">admin@192.168.1.30</span></span></button><span class="host-card-actions"><button type="button" class="host-card-edit">✎</button><button type="button" class="host-card-connect">Connect</button></span></div></li>
                            <li><div class="host-card"><button type="button" class="host-card-main"><span class="host-badge" style="background: var(--badge-1-bg); color: var(--badge-1-fg)">PH</span><span class="host-card-text"><span class="host-card-label">pi-hole</span><span class="host-card-sub">admin@192.168.1.2</span></span></button><span class="host-card-actions"><button type="button" class="host-card-edit">✎</button><button type="button" class="host-card-connect">Connect</button></span></div></li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
              </main>
            </div>
          </div>
        </div>
        <p class="device-tag" style="left: 2360px"><span>Windows PC</span></p>

        <!-- The record leaving the Mac -->
        <div class="ghost host-card" id="ghost" style="visibility: hidden"><button type="button" class="host-card-main"><span class="host-badge" style="background: var(--badge-2-bg); color: var(--badge-2-fg)">D0</span><span class="host-card-text"><span class="host-card-label">db-01</span><span class="host-card-sub">admin@192.168.1.20:2222</span></span></button></div>
        <div class="arrive" id="arrive"></div>
        <svg class="envelope" id="env" viewBox="0 0 96 68" style="visibility: hidden"><rect x="2" y="2" width="92" height="64" rx="8" fill="#20242c" stroke="#6aa7ff" stroke-width="3"></rect><path d="M4 6 48 38 92 6" fill="none" stroke="#6aa7ff" stroke-width="3" stroke-linejoin="round"></path><circle cx="48" cy="40" r="13" fill="#6aa7ff"></circle><rect x="42" y="39" width="12" height="9" rx="1.5" fill="#08111f"></rect><path d="M44.5 39v-3a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#08111f" stroke-width="2"></path></svg>
      </div>
    </div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);

        // Ciphertext: rows of hex from a seeded LCG (the same every load), the block twice so it scrolls seamlessly.
        let seed = 0x51c0de7;
        const hex4 = () => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return (seed >>> 8).toString(16).padStart(6, "0").slice(0, 4); };
        const ROWS = 16, ROW_H = 30;
        const block = Array.from({ length: ROWS }, () => Array.from({ length: 6 }, hex4).join(" ")).join("\n");
        $("hex").textContent = block + "\n" + block;

        // Measured from this layout (Mac window CSS px for the pointer, world px for the rest).
        const CARD_HOVER = { x: 531, y: 182 }, EDIT = { x: 603, y: 182 }, PORT = { x: 1132, y: 427 }, SAVE = { x: 1081, y: 780 };
        const MCARD = { x: 462, y: 155, w: 233, h: 56 }; // db-01 on the Mac, editor closed
        const PCARD = { x: 2822, y: 157, w: 233, h: 56 }; // db-01 on the PC
        const tl = gsap.timeline({ paused: true });
        const set = (el, v, t) => tl.set(typeof el === "string" ? $(el) : el, v, t);
        const hide = (id, t) => set(id, { visibility: "hidden" }, t);
        const attr = (id, a, v, t) => set(id, { attr: { [a]: v } }, t);

        // Camera: a world point (cx, cy) at the frame centre, at scale s.
        const cam = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
        const C1 = cam(720, 440, 1.2); // the MacBook
        const C2 = cam(1900, 440, 0.48); // both devices and the server
        const C3 = cam(3080, 440, 1.2); // the Windows PC
        // Close on db-01 on the PC: its new address stays legible in the site's half-width frame.
        const C4 = cam(PCARD.x + PCARD.w / 2, PCARD.y + PCARD.h / 2 + 75, 2.4);
        const W = $("world");
        tl.set(W, C1, 0);
        const camTo = (c, t, d) => tl.to(W, { ...c, duration: d, ease: "power2.inOut" }, t);

        // Hex scrolls one block in 8 s.
        tl.fromTo($("hex"), { y: 0 }, { y: -ROWS * ROW_H, duration: 8, ease: "none" }, 0);

        // Sync status in a sidebar foot (SyncStatusDot): Syncing… pulses blue, Synced is green.
        const status = (p, tone, t) => {
          attr(p + "-dot", "class", "sync-dot sync-dot-" + tone, t);
          set(p + "-sync", { textContent: tone === "idle" ? "Synced" : "Syncing…" }, t);
        };

        // Pointer (Mac window CSS px). Moves ease like a hand; clicks dip it.
        const P = $("pointer");
        const REST = { x: 980, y: 560 };
        tl.set(P, REST, 0);
        const move = (x, y, t, d = 0.4) => tl.to(P, { x, y, duration: d, ease: "power3.inOut" }, t);
        const click = (t) => tl.to(P, { scale: 0.86, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "2px 2px" }, t);

        // ---- 1. Mac: ✎ on db-01 -> Edit host -> Port 2222 -> Save host.
        move(CARD_HOVER.x, CARD_HOVER.y, 0.25);
        attr("m-db-card", "data-hover", "1", 0.55);
        move(EDIT.x, EDIT.y, 0.62, 0.25);
        click(0.9);
        // The editor opens; focus stays on ✎, so the card keeps its actions.
        set("m-editor", { display: "flex" }, 1.0);
        attr("m-page", "class", "page hosts-page with-editor", 1.0);
        attr("m-db-card", "data-editing", "true", 1.0);
        move(PORT.x, PORT.y, 1.05, 0.4);
        click(1.48);
        attr("m-db-card", "data-hover", "0", 1.52);
        attr("in-port", "class", "focus-ring", 1.52);
        ["2", "22", "222", "2222"].forEach((v, i) => attr("in-port", "value", v, 1.62 + i * 0.08));
        set("src-port", { textContent: "set on this host" }, 1.62);
        move(SAVE.x, SAVE.y, 1.98, 0.36);
        attr("btn-save", "data-hover", "1", 2.3);
        click(2.36);
        // Saved: the editor closes, focus goes back to ✎ (actions shown), the save nudges a push.
        set("m-editor", { display: "none" }, 2.45);
        attr("m-page", "class", "page hosts-page", 2.45);
        attr("m-db-card", "data-editing", "false", 2.45);
        attr("m-db-card", "data-hover", "1", 2.45);
        set("m-db-sub", { textContent: "admin@192.168.1.20:2222" }, 2.45);
        attr("in-port", "class", "", 2.45);
        move(REST.x, REST.y, 2.5, 0.5);
        status("m", "syncing", 2.45);
        tl.to($("m-dot"), { opacity: 0.35, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.45);
        status("m", "idle", 3.7);

        // ---- 2. The record seals into an envelope: Mac -> termlyx-server -> PC.
        const G = $("ghost"), E = $("env");
        set(G, { x: MCARD.x, y: MCARD.y, width: MCARD.w, height: MCARD.h, visibility: "visible", transformOrigin: "50% 50%" }, 2.5);
        tl.to(G, { scale: 0.3, opacity: 0, duration: 0.35, ease: "power2.in" }, 2.55);
        set(E, { x: MCARD.x + MCARD.w / 2, y: MCARD.y + MCARD.h / 2, scale: 0.4, opacity: 0, visibility: "visible" }, 2.55);
        tl.to(E, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 2.68);
        hide(G, 2.9);
        camTo(C2, 2.75, 0.8);
        const SRV = { x: 1900, y: 405 };
        tl.to(E, { x: SRV.x, duration: 0.8, ease: "power1.inOut" }, 2.95);
        tl.to(E, { keyframes: [{ y: 60, duration: 0.4, ease: "sine.out" }, { y: SRV.y, duration: 0.4, ease: "sine.in" }] }, 2.95);
        tl.to(E, { scale: 0.5, opacity: 0, duration: 0.15, ease: "power1.in" }, 3.7);
        tl.to($("srv-flash"), { keyframes: [{ opacity: 1, duration: 0.12 }, { opacity: 0, duration: 0.45 }] }, 3.75);

        set(E, { scale: 0.5, opacity: 0 }, 3.95);
        tl.to(E, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" }, 3.97);
        camTo(C3, 4.0, 0.85);
        tl.to(E, { x: PCARD.x + PCARD.w / 2, duration: 0.8, ease: "power1.inOut" }, 4.0);
        tl.to(E, { keyframes: [{ y: 60, duration: 0.4, ease: "sine.out" }, { y: PCARD.y + PCARD.h / 2, duration: 0.4, ease: "sine.in" }] }, 4.0);
        tl.to(E, { scale: 0.5, opacity: 0, duration: 0.15, ease: "power1.in" }, 4.75);
        hide(E, 4.9);

        // ---- 3. PC: Syncing…, db-01 reads again with the new port, Synced; then close on the card, held.
        status("p", "syncing", 4.5);
        tl.to($("p-dot"), { opacity: 0.35, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.5);
        set("p-db-sub", { textContent: "admin@192.168.1.20:2222" }, 4.85);
        const A = $("arrive");
        set(A, { x: PCARD.x - 6, y: PCARD.y - 6, width: PCARD.w + 12, height: PCARD.h + 12 }, 0);
        tl.to(A, { keyframes: [{ opacity: 1, duration: 0.12 }, { opacity: 0, duration: 0.9, ease: "power1.in" }] }, 4.82);
        status("p", "idle", 5.0);

        // The Mac, off camera from here, goes back to frame 0.
        const mReset = 5.6;
        attr("m-db-card", "data-hover", "0", mReset);
        set("m-db-sub", { textContent: "admin@192.168.1.20" }, mReset);
        attr("in-port", "value", "", mReset);
        set("src-port", { textContent: "default" }, mReset);
        attr("btn-save", "data-hover", "0", mReset);

        // Back to frame 0.
        camTo(C4, 5.45, 0.55);
        camTo(C1, 7.1, 0.85);
        // The PC, off camera now, goes back to frame 0.
        set("p-db-sub", { textContent: "admin@192.168.1.20" }, 7.95);
        tl.set({}, {}, 8);

        window.__timelines = window.__timelines || {};
        window.__timelines["sync"] = tl;
      })();
    </script>
  </body>
</html>
